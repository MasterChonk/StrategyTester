[project]
name = "crypto-trend-follower"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "backtesting>=0.6.5",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import crypto_trend`.
pythonpath = ["."]
testpaths = ["tests"]
